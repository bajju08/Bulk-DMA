name: NSE BULK DMA

on:
  workflow_dispatch:

  schedule:
    - cron: '15 11 * * 1-5'

jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Script
        env:
          GOOGLE_CREDS_SECRET: ${{ secrets.GOOGLE_CREDS_SECRET }}
        run: |
          python pipeline_sync.py
